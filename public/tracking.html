<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - FastDeliver</title>
    <link rel="stylesheet" href="CSS/tracking.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header class="header">
    <h1 class="title">FastDeliver</h1>
    <button id="login-btn" class="login-btn">Connexion</button>
</header>

<main>
    <div class="tracking-container">
        <!-- Tracking Header -->
        <div class="tracking-header">
            <div class="tracking-title">
                <h2>Suivi du colis</h2>
                <p><strong>N° FD28465940BE</strong><span class="small-status"> En Livraison</span></p>
            </div>
        </div>
        <hr class="separator">



        <!-- Tracking Details -->
        <div class="tracking-details">
            <h3>Détails de livraison</h3>
            <div class="details-row">
                <div class="details-block">
                    <p>Date estimée :</p>
                </div>
                <div class="details-block">
                    <p>Poids :</p>
                </div>
                <div class="details-block">
                    <p>Destinataire :</p>
                </div>
            </div>
        </div>



        <h3>Statut de livraison</h3>
            <!-- Delivery Status -->
          <div class="timeline"></div>




        <!-- Delivery Address -->
        <div class="details-block-footer">
            <h3>Adresse de livraison</h3>
            <p id="clientAddress"></p>
        </div>

    </div>
</main>

<footer class="footer">
    © 2024 FastDeliver - Tous droits réservés
</footer>

<script src="JS/tracking.js" defer></script>
</body>
</html>
