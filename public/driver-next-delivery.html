<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prochaine livraison - FasterDeliver</title>
    <link rel="stylesheet" href="CSS/driver-next-delivery.css">
</head>
<body>

<header class="header">
    <div class="title">FastDeliver</div>
    <div class="role">Livreur</div>
    <div class="admin-info">
        <p>Emma Roux</p>
    </div>
    <button id="logout" class="logout-btn">Déconnexion</button>
</header>

<main>
    <div class="delivery-card">
        <div class="card-header">
            <h1>Prochaine livraison</h1>
            <div class="buttons">
                <button class="problem-btn">Problème</button>
                <button class="delivered-btn">Marquer comme livré</button>
            </div>
        </div>

        <div class="package">
        <p>Colis: FD28465940BE</p>
        </div>

        <div class="separator"></div>

        <div class="recipient-info">
            <h2>Destinataire</h2>
            <p><span>Nom:</span> </p>
            <div class="dataRecipient">
            <p >Pluqet Frédéric</p>
            </div>
            <p><span>Téléphone:</span></p>
            <div class="dataRecipient">
            <p> 06988888</p>
            </div>
            <p><span>Adresse:</span></p>
            <div class="dataRecipient">
            <p>42 rue Lilas</p>
            <p>Appartement 3B - 2ème étage</p>
            <p>75011 Paris</p>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2024 FastDeliver - Tous droits réservés</p>
</footer>

<script src="JS/driver-next-delivery.js" defer></script>
</body>
</html>
