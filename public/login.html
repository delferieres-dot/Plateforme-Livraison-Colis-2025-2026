<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - FastDeliver</title>
    <link rel="stylesheet" href="CSS/login.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header class="header">
    <h1 class="title">FastDeliver</h1>
</header>

<div class="loginContainer">
    <div class="loginBox">
        <h2>Connexion</h2>
        <div class="textLogin">Login</div>
        <form id="loginForm">
            <label for="login"></label>
            <input type="email" id="login" name="login" placeholder="Email" required>
            <div class="textPassword">Mot de passe</div>
            <label for="password"></label>
            <input type="password" id="password" name="password" placeholder="Mot de passe" required>
            <button type="submit" id="loginButton">Se connecter</button>
        </form>
    </div>
</div>

<footer class="footer">
    © 2024 FastDeliver - Tous droits réservés
</footer>

<script src="JS/login.js" defer></script>
</body>
</html>
