<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>FastDeliver - Livraison rapide de colis</title>
    <link rel="stylesheet" href="CSS/index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header class="header">
    <div class="title">FastDeliver</div>
    <button id ="loginButton" class="login">Connexion</button>
</header>

<section class="middle">
    <div class="middleText">
        <h1 class="middleTitle">Livraison rapide et sécurisée de vos colis</h1>
        <p class="middleText">Service de livraison 24/7 partout en Belgique</p>
    </div>
    <div class="search">
            <input type="text" placeholder="Entrez votre numéro de suivi">
        <button class="buttonFollow">Suivre mon colis</button>
    </div>
</section>

<section class="frame">
    <div class="frameBox elementBox1">
        <div class="emoji">📦</div>
        <div class ="frameTitle">Livraison Rapide</div>
        <div class="frameText">Livraison garantie en 24-48h</div>
    </div>
    <div class="frameBox elementBox2">
        <div class="emoji">🔒</div>
        <div class ="frameTitle">Sécurisé</div>
        <div class="frameText">Suivi en temps réel de vos colis</div>
    </div>
    <div class="frameBox elementBox3">
        <div class="emoji">💰</div>
        <div class ="frameTitle">Prix Compétitifs</div>
        <div class="frameText">Tarifs adaptés à vos besoins</div>
    </div>
</section>

<footer class="footer">
    <p>&copy; 2024 FastDeliver - Tous droits réservés</p>
</footer>
<script src="JS/index.js" defer></script>

</body>
</html>
